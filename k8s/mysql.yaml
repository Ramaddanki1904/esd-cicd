apiVersion: apps/v1
kind: Deployment
metadata:
  name: ems-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ems-mysql
  template:
    metadata:
      labels:
        app: ems-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "root"
            - name: MYSQL_DATABASE
              value: "emsdb"
            - name: MYSQL_USER
              value: "emsuser"
            - name: MYSQL_PASSWORD
              value: "emspassword"
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ems-mysql
spec:
  selector:
    app: ems-mysql
  ports:
    - port: 3306
      targetPort: 3306
